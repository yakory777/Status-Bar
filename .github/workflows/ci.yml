name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile hooks/forward.py host/daemon.py host/scenes.py host/adapters/*.py tools/*.py
      - name: Adapter tests
        run: python tests/test_adapters.py
      - name: Validate manifests
        run: |
          for f in .claude-plugin/*.json .codex-plugin/*.json .agents/plugins/*.json hooks/*.json; do
            python -m json.tool "$f" > /dev/null && echo "ok $f"
          done

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: firmware
      - name: Merge into one binary
        run: |
          cd firmware/build
          docker run --rm -v "$PWD:/w" -w /w espressif/idf:v5.3 \
            esptool.py --chip esp32s3 merge_bin -o agent-status-bar.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/agent-status-bar.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
      - uses: softprops/action-gh-release@v2
        with:
          files: agent-status-bar.bin
