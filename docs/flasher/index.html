<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Status Bar Setup</title>
<meta name="description" content="Flash the Agent Status Bar board and set up its Wi-Fi from the browser — no console needed.">
<link rel="icon" href="icon.png">
<script type="module" src="https://unpkg.com/esp-web-tools@10.1.1/dist/web/install-button.js?module"></script>
<style>
  :root {
    --bg: #F7F6F2; --card: #FFFFFF; --fg: #1F1E1D; --muted: #6B6A66; --line: #E5E3DC;
    --accent: #C8643F; --accent-fg: #FFFFFF; --accent-soft: #F6E6DE;
    --ok: #2E7D4F; --ok-soft: #E3F1E8; --warn: #B4570B; --warn-soft: #FBEBD9; --bad: #B42318; --bad-soft: #FBE4E1;
    --field: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1918; --card: #242322; --fg: #F2F1EC; --muted: #A8A69E; --line: #393734;
      --accent: #E07A55; --accent-fg: #1A1918; --accent-soft: #3A2A23;
      --ok: #5CC98A; --ok-soft: #1F3328; --warn: #F0A15A; --warn-soft: #3A2C1D; --bad: #F2867A; --bad-soft: #3C2220;
      --field: #1D1C1B;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  header img { width: 44px; height: 44px; border-radius: 10px; }
  header h1 { flex: 1; margin: 0; font-size: 22px; line-height: 1.25; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; font: inherit;
                 font-size: 13px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .banner { padding: 12px 14px; border-radius: 10px; margin: 0 0 20px; }
  .banner.bad { background: var(--bad-soft); color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font-size: 17px; }
  .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
         display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .card > p.sub { color: var(--muted); margin: 0 0 16px 36px; }
  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .board { position: relative; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .board input { position: absolute; opacity: 0; }
  .board b { display: block; }
  .board span { color: var(--muted); font-size: 13px; }
  .board:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .board:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--warn-soft);
         color: var(--warn); margin-left: 4px; vertical-align: 1px; }
  .btn { border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
         background: var(--accent); color: var(--accent-fg); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  .btn.small { padding: 5px 11px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .note { color: var(--muted); font-size: 13.5px; margin: 12px 0 0; }
  .note li { margin: 3px 0; }
  .note ul { margin: 6px 0 0; padding-left: 18px; }
  .status { padding: 10px 12px; border-radius: 10px; margin-top: 14px; font-size: 14px; }
  .status:empty { display: none; }
  .status.ok { background: var(--ok-soft); color: var(--ok); }
  .status.warn { background: var(--warn-soft); color: var(--warn); }
  .status.bad { background: var(--bad-soft); color: var(--bad); }
  .status.info { background: var(--accent-soft); color: var(--fg); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 13px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  h3 { font-size: 14px; margin: 20px 0 8px; }
  ul.nets { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; }
  ul.nets li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); }
  ul.nets li:first-child { border-top: 0; }
  ul.nets li span { flex: 1; overflow-wrap: anywhere; }
  ul.nets li.empty { color: var(--muted); }
  form.add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=password] { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line);
         background: var(--field); color: var(--fg); font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .show { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 8px; cursor: pointer; }
  code { font: 13px ui-monospace, Consolas, monospace; background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 28px; }
  a.btn { text-decoration: none; display: inline-block; }
  /* пока установщик не загрузился, запасные надписи не показываем — он сам покажет нужную */
  esp-web-install-button:not(:defined) > [slot="unsupported"],
  esp-web-install-button:not(:defined) > [slot="not-allowed"] { display: none; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) {
    .boards { grid-template-columns: 1fr; }
    form.add { grid-template-columns: 1fr; }
    .card > p.sub { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon.png" alt="">
    <h1 data-t="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button>
    </div>
  </header>
  <p class="lead" data-t="lead"></p>
  <p class="banner bad" id="unsupported" hidden data-t="unsupported"></p>

  <section class="card">
    <h2><span class="num">1</span><span data-t="s1_title"></span></h2>
    <p class="sub" data-t="s1_sub"></p>
    <div class="boards">
      <label class="board"><input type="radio" name="board" value="lcd" checked>
        <b>T-Display-S3</b><span data-t="lcd_desc"></span></label>
      <label class="board"><input type="radio" name="board" value="amoled">
        <b>T-Display-S3 AMOLED <span class="tag" data-t="untested"></span></b><span data-t="amoled_desc"></span></label>
    </div>
  </section>

  <section class="card">
    <h2><span class="num">2</span><span data-t="s2_title"></span></h2>
    <p class="sub"><span data-t="s2_sub"></span> <b id="fw_version">…</b></p>
    <div class="row">
      <esp-web-install-button id="installer" manifest="manifest-lcd.json">
        <button slot="activate" class="btn" type="button" data-t="flash"></button>
        <span slot="unsupported" data-t="unsupported"></span>
        <span slot="not-allowed" data-t="not_allowed"></span>
      </esp-web-install-button>
    </div>
    <div class="status" id="flash_status" role="status"></div>
    <div class="note">
      <ul>
        <li data-t="flash_tip_close"></li>
        <li data-t="flash_tip_boot"></li>
        <li data-t="flash_tip_keep"></li>
      </ul>
    </div>
  </section>

  <section class="card">
    <h2><span class="num">3</span><span data-t="s3_title"></span></h2>
    <p class="sub" data-t="s3_sub"></p>
    <div class="row">
      <button class="btn" id="connect" type="button" data-t="connect"></button>
      <button class="btn ghost" id="disconnect" type="button" data-t="disconnect" hidden></button>
    </div>
    <div class="status" id="status" role="status"></div>

    <div id="panel" hidden>
      <dl>
        <dt data-t="board_id"></dt><dd id="i_id">—</dd>
        <dt data-t="firmware"></dt><dd id="i_fw">—</dd>
        <dt data-t="wifi"></dt><dd id="i_wifi">—</dd>
      </dl>
      <h3 data-t="saved"></h3>
      <ul class="nets" id="nets"></ul>
      <h3 data-t="add_title"></h3>
      <form class="add" id="add" autocomplete="off">
        <label class="f"><span data-t="ssid"></span><input type="text" id="ssid" required maxlength="32" spellcheck="false"></label>
        <label class="f"><span data-t="password"></span><input type="password" id="pass" maxlength="63"></label>
        <button class="btn" type="submit" data-t="add"></button>
      </form>
      <label class="show"><input type="checkbox" id="showpass"><span data-t="show_password"></span></label>
      <p class="note" data-t="wifi_tip"></p>
    </div>
  </section>

  <section class="card">
    <h2><span class="num">4</span><span data-t="s4_title"></span></h2>
    <p class="sub" data-t="s4_sub"></p>
    <div class="row">
      <a class="btn ghost" id="repo_link" href="https://github.com/yakory777/Status-Bar" data-t="open_repo"></a>
    </div>
  </section>

  <footer data-t="footer"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
